<!DOCTYPE html>
<html>
<head>
  <title>Round Rotating Image</title>

  <style>
    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#111;
    }

    .circle{
      width:250px;
      height:250px;
      border-radius:50%;
      overflow:hidden;
      animation:rotate 5s linear infinite;
      border:5px solid white;
    }

    .circle img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    @keyframes rotate{
      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="circle">
    <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d">
  </div>

</body>
</html>
